server:
  port: 81
  servlet:
    context-path: /app
mybatis-plus:
  mapper-locations: classpath:com/saodi/mapper/*Mapper.xml
  type-aliases-package: com.saodi.po
  configuration:
    map-underscore-to-camel-case: true  #关闭驼峰转换下划线
spring:
  datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/theater
      username: root
      password: ${MYSQL_PASSWORD:1234}
  redis:
    # 与 manager 保持一致：本机 Redis 没设 requirepass，写死密码会让 Lettuce 的 AUTH 被拒。
    # 需要密码时 set REDIS_PASSWORD=xxx，别把口令写回文件。
    password: ${REDIS_PASSWORD:}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  servlet:
    multipart:
      max-file-size: 5MB
logging:
  level:
    com.saodi: trace

# 影院智能体。api-key 留空时自动退到规则兜底，功能照常可用。
# 端点是 OpenAI 兼容的 /chat/completions，接入方、模型、key 全走环境变量，换模型不改代码：
#   set AI_API_KEY=sk-xxx
#   set AI_BASE_URL=https://chat.intern-ai.org.cn/api/v1
#   set AI_MODEL=intern-s2-preview
# 下面这组默认值是实测过完整 tool 回路（要工具 → 喂回结果 → 出正文）的一家；
# 换 SenseNova 只改后两行：https://token.sensenova.cn/v1 + deepseek-v4-flash。
# 各家限流不一样，撞到 429 时前端会明说「模型这次没叫通」并退到查库拼出来的那版。
ai:
  api-key: "${AI_API_KEY:}"
  base-url: "${AI_BASE_URL:https://chat.intern-ai.org.cn/api/v1}"
  model: "${AI_MODEL:intern-s2-preview}"
  max-tool-rounds: 5
  timeout-ms: 30000
  # 草稿确认凭证在 Redis 里存多久；过期后要重新要一份草稿
  draft-ttl-seconds: 600

# 对象存储（头像上传）。密钥不写在源码里，四项全部走环境变量注入：
#   set QINIU_ACCESS_KEY=xxx
#   set QINIU_SECRET_KEY=yyy
#   set QINIU_BUCKET=你的桶名
#   set QINIU_DOMAIN=桶的访问域名
# 仓库里不留任何默认值（连桶名都不留），没配时上传接口返回 511 并说清缺哪几项。
qiniu:
  access-key: ${QINIU_ACCESS_KEY:}
  secret-key: ${QINIU_SECRET_KEY:}
  bucket: ${QINIU_BUCKET:}
  domain: ${QINIU_DOMAIN:}
