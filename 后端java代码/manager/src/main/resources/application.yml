server:
  port: 80
  servlet:
    context-path: /
mybatis-plus:
  mapper-locations: classpath:com/saodi/mapper/*Mapper.xml
  type-aliases-package: com.saodi.po
  configuration:
    map-underscore-to-camel-case: true  #关闭驼峰转换下划线
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/theater
    username: root
    password: ${MYSQL_PASSWORD:1234}
  redis:
    # 本机 redis.windows-service.conf 里 requirepass 是注释掉的（CONFIG GET requirepass 返回空），
    # 而这里原来写死了 123456 —— Lettuce 照发 AUTH，Redis 直接回
    # "ERR Client sent AUTH, but no password is set"，于是拦截器里每一次
    # redisTemplate.get() 都抛 RedisConnectionException，前端看到的就是
    # 每个菜单都 "服务器内部错误"。改成默认不带密码，需要时用环境变量注入。
    password: ${REDIS_PASSWORD:}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 5MB
logging:
  level:
    com.saodi: trace

# 对象存储（图片上传）。密钥不写在源码里，四项全部走环境变量注入：
#   set QINIU_ACCESS_KEY=xxx
#   set QINIU_SECRET_KEY=yyy
#   set QINIU_BUCKET=你的桶名
#   set QINIU_DOMAIN=桶的访问域名
# 仓库里不留任何默认值（连桶名都不留），没配时上传接口返回 511 并说清缺哪几项。
qiniu:
  access-key: ${QINIU_ACCESS_KEY:}
  secret-key: ${QINIU_SECRET_KEY:}
  bucket: ${QINIU_BUCKET:}
  domain: ${QINIU_DOMAIN:}
